<div class="container mt-4 mb-4 p-3 d-flex justify-content-center">
    <form
    [formGroup]="accountForm"
    (ngSubmit)="updateAccount()"
    >
    <mat-card *ngIf="onLoad">
        <mat-card-header class="d-flex flex-column justify-content-center align-items-center">
            <mat-card-title class="mat-headline-5">Actualiza tu perfil</mat-card-title>
            <img 
                *ngIf="viewImg"
                [src]= currentUser.getImgUrl
                height="100" 
                width="100" 
                class="avatar"
            />
            <img 
                *ngIf="!viewImg"
                [src]= imgTemp
                height="100" 
                width="100" 
                class="avatar"/>
        </mat-card-header>
        <mat-card-content class="pt-3">
            <mat-form-field class="w-100">
                <ngx-mat-file-input
                    (change)="cambiarImagen($event)" 
                    formControlName="archivo">
                </ngx-mat-file-input>
                <mat-icon matSuffix>folder</mat-icon>
              </mat-form-field>
        </mat-card-content>
        <mat-card-content>
            <mat-form-field appearance="outline" class="w-100">
            <mat-label class="">Nombre</mat-label>
            <mat-icon matSuffix>person</mat-icon>
            <input
                matInput
                formControlName="nombre"
                type="text" 
                class="form-control" 
                id="nombre" 
                value="{{currentUser.nombre}}"
                >
            </mat-form-field>
        </mat-card-content>
        <mat-card-content>
            <mat-form-field appearance="outline" class="w-100">
            <mat-label class="">Email</mat-label>
            <mat-icon matSuffix>email</mat-icon>
            <input
                matInput
                formControlName="email"
                type="email" 
                class="form-control" 
                id="nombre" 
                value="{{currentUser.email}}"
                >
            </mat-form-field>
        </mat-card-content>
        <mat-card-content>
            <mat-card-actions class="pb-3">
                <button 
                    class="w-100"
                    color="primary"
                    mat-raised-button
                    [disabled]="accountForm.invalid"
                    type="submit">
                    <mat-icon matSuffix>table_restaurant</mat-icon>Guardar cambios
                </button>
            </mat-card-actions>
        </mat-card-content>
    </mat-card>
    </form>
</div>
